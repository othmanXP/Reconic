[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reconic"
version = "2.0.0a1"
description = "Scope-safe recon orchestrator for subfinder, dnsx, httpx, katana and nuclei"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Othman Kamal" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
reconic = "reconic.cli:main"

[tool.setuptools]
packages = ["reconic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
