[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reconic"
version = "2.0.0.dev0"
description = "Scope-safe recon orchestrator for subfinder, httpx, katana and nuclei"
requires-python = ">=3.9"
authors = [{ name = "Othman Kamal" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
reconic = "reconic.cli:main"

[tool.setuptools]
packages = ["reconic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
